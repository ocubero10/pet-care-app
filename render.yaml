services:
  - type: web
    runtime: static
    name: liz-and-pets-web
    rootDir: .
    buildCommand: npm install && npx expo export -p web
    staticPublishPath: ./dist
    autoDeploy: true
    pullRequestPreviewsEnabled: false
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://pet-care-server-wlyc.onrender.com/api
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /_expo/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
